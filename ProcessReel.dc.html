<x-dc>

    <figure style="flex:1.15 1 420px;min-width:min(100%,290px);margin:0;position:relative;background-color:#F4EFE3;background-image:repeating-linear-gradient(180deg,transparent 0 29px,#E3DBCB 29px 30px);padding:clamp(16px,2.4vw,30px) clamp(14px,2.2vw,28px) clamp(12px,1.8vw,20px);transform:rotate(-.7deg);box-shadow:0 1px 0 #D6CDB8,0 28px 44px -30px rgba(23,23,20,.55)">

            <div style="width:42%;aspect-ratio:1;border-radius:50%;border:1.5px solid #9E9E97;background:#E2E2DD"></div>
            <div style="height:6%;width:72%;background:#9E9E97;border-radius:2px"></div>

      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,16px);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:#4E4E49;border-top:1px solid #CFCFC9;padding-top:10px">
        <span>1 · {{ w1 }}</span><span>2 · {{ w2 }}</span><span>3 · {{ w3 }}</span>

    <div style="display:flex;align-items:center;gap:14px;padding:9px 14px;background:#2C2C2C;border-bottom:1px solid #383838;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#B3B3B3">
      <span style="display:flex;gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:#555"></span><span style="width:9px;height:9px;border-radius:50%;background:#555"></span><span style="width:9px;height:9px;border-radius:50%;background:#555"></span></span>
      <span style="letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A">03 · Prototype</span>
      <span style="flex:1;text-align:center;color:#E6E6E6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ name }} / Flows / Main path</span>

    </div>

          <div style="aspect-ratio:9/19;background:#111;border-radius:12px;overflow:hidden"><img src="{{ s1 }}" alt="{{ name }} — {{ w1 }}" loading="lazy" style="display:block;width:100%;height:100%;object-fit:{{ fitMode }}"></div>
        </div>
        <div style="flex:0 0 clamp(34px,6vw,96px);display:flex;flex-direction:column;align-items:center;gap:4px">
          <svg viewBox="0 0 96 30" style="width:100%;height:auto;display:block"><circle cx="4" cy="15" r="3.5" fill="#4C8DFF"></circle><path d="M6,15 C34,15 40,6 62,10 S80,15 88,15" fill="none" stroke="#4C8DFF" stroke-width="1.8"></path><path d="M84,10 L92,15 L84,20" fill="none" stroke="#4C8DFF" stroke-width="1.8"></path></svg>

        </div>
        <div style="flex:1 1 0;min-width:0;max-width:230px;display:flex;flex-direction:column;gap:7px;position:relative">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#4C8DFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">⌗ {{ w2 }}</span>

            <div style="position:absolute;inset:0;border-radius:12px;overflow:hidden"><img src="{{ s2 }}" alt="{{ name }} — {{ w2 }}" loading="lazy" style="display:block;width:100%;height:100%;object-fit:{{ fitMode }}"></div>
            <span style="position:absolute;top:-7px;left:-7px;width:8px;height:8px;background:#fff;border:1.5px solid #4C8DFF"></span>
            <span style="position:absolute;top:-7px;right:-7px;width:8px;height:8px;background:#fff;border:1.5px solid #4C8DFF"></span>
            <span style="position:absolute;bottom:-7px;left:-7px;width:8px;height:8px;background:#fff;border:1.5px solid #4C8DFF"></span>
            <span style="position:absolute;bottom:-7px;right:-7px;width:8px;height:8px;background:#fff;border:1.5px solid #4C8DFF"></span>
          </div>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:980},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E4553C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Gharbar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;address = last&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;who do I know?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;n3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ticket, not receipt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Discover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Party&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pass&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;s1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/Gharbar%20app%20design%20system/10-discover.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;s2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/Gharbar%20app%20design%20system/11-party-detail.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;s3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/Gharbar%20app%20design%20system/52-entry-pass.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cover&quot;,&quot;contain&quot;],&quot;default&quot;:&quot;cover&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      accent: p.accent ?? '#E4553C', name: p.title ?? 'Project',
      n1: p.n1 ?? 'what first?', n2: p.n2 ?? 'this is the moment', n3: p.n3 ?? 'confirm, quietly',
      w1: p.w1 ?? 'Home', w2: p.w2 ?? 'Detail', w3: p.w3 ?? 'Confirm',
      s1: p.s1 ?? '', s2: p.s2 ?? '', s3: p.s3 ?? '', fitMode: p.fit ?? 'cover'
    };
  }
}
</script>
